  bridge:
    aliases: [bridges, vortex]
    link_preview: false
    text: |-
      🌉 <b>Bridges</b>

      ⚡ <b>Vortex — Ethereum ⇄ Koinos</b>
      The only bridge between Koinos and Ethereum. It locks your tokens on one chain and mints the wrapped version on the other. The transfer does not finish by itself: you return and press <b>Redeem</b> on the target chain, and the Koinos-side redeem costs mana.
      🔗 <a href="https://vortexbridge.io/bridge">vortexbridge.io/bridge</a>

      🌀 <b>Portal (Wormhole) — Ethereum ⇄ Base / Solana</b>
      Moves vKOIN between Ethereum, Base and Solana. It does not support Koinos, so vKOIN held on Base or Solana sits two bridges away from native KOIN.
      🔗 <a href="https://portalbridge.com">portalbridge.com</a>

      🧪 <b>Test with dust first — on each bridge, every time.</b> Send a tiny amount, redeem it, and see it arrive in your own wallet setup before you send real size.

      ⚠️ <i>Both are third-party services. Check the domain in your address bar before you sign anything.</i>


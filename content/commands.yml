# koinbot content — editable via pull request.
#
# After a PR touching only content/ is merged into main, the bot
# auto-deploys the change within ~2 minutes. Text is Telegram HTML
# (<b>, <i>, <a href="...">). Keep it valid — CI checks this file.
#
# commands: each key becomes a /command. "aliases" adds more names.
# menus:    texts behind the inline-keyboard buttons.
# texts:    shared building blocks used by the bot code.

texts:
  main_menu: |-
    🔮 <b>Welcome to Koinos Bot!</b>

